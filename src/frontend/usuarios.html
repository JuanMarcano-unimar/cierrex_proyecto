<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - CIERREX</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus\+Jakarta\+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .p-card { border-radius:20px; overflow:hidden; margin-bottom:20px; max-width:800px; }
        .p-card-header { background:linear-gradient(135deg,#1E3A8A 0%,#3B82F6 55%,#FBBF24 100%); padding:18px 26px 14px; }
        .p-card-header h5 { color:#fff!important; font-family:'Outfit',sans-serif; font-size:1.05rem; font-weight:700; margin:0; }
        .p-card-header p  { color:rgba(255,255,255,0.7); font-size:0.82rem; margin:4px 0 0; }
        .p-card-body { padding:24px 28px; }

        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .form-grid label { font-size:0.79rem; font-weight:600; color:rgba(255,255,255,0.5)!important; margin-bottom:5px; display:block; }
        .btn-submit { width:100%; background:linear-gradient(135deg,#3B82F6,#1E3A8A); border:none; border-radius:13px; padding:12px; color:#fff; font-family:'Outfit',sans-serif; font-weight:700; font-size:0.95rem; cursor:pointer; transition:all 0.25s; margin-top:18px; }
        .btn-submit:hover { transform:translateY(-2px); box-shadow:0 6px 22px rgba(59,130,246,0.4); }

        .role-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:20px; font-size:0.72rem; font-weight:700; }
        .role-1 { background:rgba(59,130,246,0.15); color:#93C5FD; border:1px solid rgba(59,130,246,0.25); }
        .role-2 { background:rgba(16,185,129,0.15); color:#34D399; border:1px solid rgba(16,185,129,0.25); }
        .role-3 { background:linear-gradient(135deg,rgba(251,191,36,0.2),rgba(251,146,60,0.2)); color:#FBBF24; border:1px solid rgba(251,191,36,0.3); }

        .btn-act { border:none; border-radius:8px; padding:5px 12px; font-size:0.73rem; font-weight:700; cursor:pointer; transition:all 0.15s; }
        .btn-act:hover { transform:scale(1.07); }
        .btn-act-edit   { background:linear-gradient(135deg,#3B82F6,#1E3A8A); color:#fff; }
        .btn-act-delete { background:linear-gradient(135deg,#EF4444,#B91C1C); color:#fff; }

        .modal-body label { font-size:0.79rem; font-weight:600; color:rgba(255,255,255,0.5)!important; margin-bottom:5px; display:block; }

        @media (max-width:576px) { .form-grid { grid-template-columns:1fr; } .p-card-body { padding:18px 16px; } }
    </style>
</head>
<body>
    <script src="js/app.js"></script>
    <script src="js/sidebar.js"></script>

    <div class="page-content">
        <div class="page-header">
            <h1>👥 Gestión de Usuarios</h1>
            <p>Administra los empleados y sus niveles de acceso al sistema</p>
        </div>

        <div class="p-card">
            <div class="p-card-header"><h5>➕ Agregar Empleado</h5><p>Crea una nueva cuenta de acceso al sistema</p></div>
            <div class="p-card-body">
                <div id="userAlert" class="alert" role="alert"></div>
                <div class="section-title">Datos del Empleado</div>
                <form id="userForm" novalidate>
                    <div class="form-grid">
                        <div><label for="name">👤 Nombre Completo</label><input type="text" class="form-control" id="name" placeholder="Juan Pérez" required></div>
                        <div><label for="email">📧 Correo Electrónico</label><input type="email" class="form-control" id="email" placeholder="correo@empresa.com" required></div>
                        <div><label for="password">🔒 Contraseña</label><input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
                        <div><label for="role">🎚️ Nivel de Acceso</label>
                            <select class="form-select" id="role">
                                <option value="1">🧾 Cajero — Solo Registros</option>
                                <option value="2">📊 Administrativo — Cierres e Historial</option>
                                <option value="3">🏆 Corporativo — Acceso Total</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" class="btn-submit" onclick="createUser()">✅ Crear Usuario</button>
                </form>
            </div>
        </div>

        <div class="p-card" style="max-width:100%;">
            <div class="p-card-header"><h5>👥 Empleados Registrados</h5><p>Todos los usuarios con acceso al sistema</p></div>
            <div class="p-card-body" style="padding:0 0 2px;">
                <div class="table-responsive">
                    <table class="table table-striped text-center" style="margin:0;">
                        <thead><tr><th>Nombre</th><th>Correo</th><th>Rol / Nivel</th><th>Acciones</th></tr></thead>
                        <tbody id="usersTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal editar -->
    <div class="modal fade" id="userEditModal" tabindex="-1" aria-labelledby="userEditModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="userEditModalLabel">✏️ Editar Empleado</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="editUserForm"><input type="hidden" id="editUserId">
                        <div class="mb-3"><label for="editName">👤 Nombre Completo</label><input type="text" class="form-control" id="editName" required></div>
                        <div class="mb-3"><label for="editEmail">📧 Correo Electrónico</label><input type="email" class="form-control" id="editEmail" required></div>
                        <div class="mb-3"><label for="editPassword">🔒 Nueva Contraseña <small style="font-weight:400;color:rgba(255,255,255,0.3);">(opcional)</small></label><input type="password" class="form-control" id="editPassword" placeholder="Dejar en blanco para no cambiar"></div>
                        <div class="mb-3"><label for="editRole">🎚️ Nivel de Acceso</label>
                            <select class="form-select" id="editRole">
                                <option value="1">🧾 Cajero</option>
                                <option value="2">📊 Administrativo</option>
                                <option value="3">🏆 Corporativo</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="updateUser()">💾 Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
